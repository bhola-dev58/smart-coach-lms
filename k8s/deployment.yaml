apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradify-academy
  labels:
    app: gradify-academy
spec:
  replicas: 3 # Start with 3 instances for high availability
  selector:
    matchLabels:
      app: gradify-academy
  template:
    metadata:
      labels:
        app: gradify-academy
    spec:
      containers:
        - name: gradify-academy
          image: your-docker-registry/gradify-academy:latest # Replace with your actual image
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: gradify-academy-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
